<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COCODRONE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23FF8C2F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Open+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main" data-l="skip"></a>

  <!-- 상단 유틸 바 (40px) -->
  <div class="util">
    <div class="container util-in">
      <div class="util-left">
        <span class="util-brand">COCODRONE</span>
        <a href="#benefits" data-goto="benefits" data-i18n="nav.about"></a>
        <a href="https://smartstore.naver.com/cocodroneshop" data-store target="_blank" rel="noopener" data-i18n="nav.store"></a>
      </div>
      <div class="util-lang lang-switch" id="langUtil" role="group" data-l-attr="aria-label:lang"></div>
    </div>
  </div>

  <!-- 메인 내비 (64px) -->
  <header class="gnav">
    <div class="container gnav-in">
      <a class="logo" href="#top" data-goto="top">COCODRONE</a>
      <nav class="gnav-menu" data-i18n-attr="aria-label:nav.menu">
        <a href="#competition" data-goto="competition" data-i18n="nav.competition"></a>
        <a href="#film" data-goto="film" data-i18n="nav.video"></a>
        <a href="#products" data-goto="products" data-i18n="nav.products"></a>
        <a href="#notice" data-goto="notice" data-i18n="nav.notice"></a>
        <a href="#apply" data-goto="apply" data-i18n="nav.apply"></a>
      </nav>
      <a class="gnav-store" href="https://smartstore.naver.com/cocodroneshop" data-store target="_blank" rel="noopener" data-i18n-attr="aria-label:nav.store;title:nav.store">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="gnav-store-label" data-i18n="nav.store"></span>
      </a>
    </div>
  </header>

  <!-- 배너 (500px) -->
  <section class="banner" id="top">
    <div class="container banner-in">
      <div class="banner-text">
        <h1 class="banner-title" id="bannerTitle"></h1>
        <p class="banner-sub" data-c="competition.tagline"></p>
        <a class="btn banner-btn" href="#apply" data-goto="apply" data-i18n="cta.applyShort"></a>
      </div>
    </div>
  </section>

  <!-- 탭 바 (50px). body 직속이어야 배너를 지난 뒤 푸터까지 상단에 고정된다 -->
  <nav class="tabbar" id="tabbar" data-i18n-attr="aria-label:nav.menu">
    <div class="tabbar-scroll" id="tabScroll">
      <ul class="tabbar-list">
        <li><a class="tab" href="#competition" data-goto="competition" data-tab="competition" data-i18n="nav.competition"></a></li>
        <li><a class="tab" href="#film" data-goto="film" data-tab="film" data-i18n="nav.video"></a></li>
        <li><a class="tab" href="#products" data-goto="products" data-tab="products" data-i18n="nav.products"></a></li>
        <li><a class="tab" href="#notice" data-goto="notice" data-tab="notice" data-i18n="nav.notice"></a></li>
        <li><a class="tab" href="#apply" data-goto="apply" data-tab="apply" data-i18n="nav.apply"></a></li>
      </ul>
    </div>
  </nav>

  <main id="main">
    <!-- 대회 소개 -->
    <section class="sec" id="competition" aria-labelledby="h-competition">
      <div class="container">
        <header class="sec-head">
          <h2 id="h-competition" tabindex="-1" data-i18n="nav.competition"></h2>
          <p data-c="competition.summary"></p>
        </header>
        <div class="big-grid" id="compCards"></div>
        <div class="card sched" id="compSchedule"></div>
      </div>
    </section>

    <!-- 홍보 영상 -->
    <section class="sec" id="film" aria-labelledby="h-film">
      <div class="container">
        <header class="sec-head">
          <h2 id="h-film" tabindex="-1" data-i18n="comp.videoTitle"></h2>
          <p data-c="competition.tagline"></p>
        </header>
        <div class="card film" id="filmCard"></div>
      </div>
    </section>

    <!-- 제품 -->
    <section class="sec" id="products" aria-labelledby="h-products">
      <div class="container">
        <header class="sec-head">
          <h2 id="h-products" tabindex="-1" data-i18n="products.featured"></h2>
          <p data-i18n="products.sub"></p>
        </header>
        <div class="big-grid" id="featuredGrid"></div>

        <div class="subsec">
          <header class="sec-head">
            <h2 data-i18n="products.all"></h2>
          </header>
          <ul class="small-grid" id="allGrid"></ul>
          <p class="more">
            <a class="text-link" href="https://smartstore.naver.com/cocodroneshop" data-store target="_blank" rel="noopener"><span data-i18n="cta.viewAll"></span><span aria-hidden="true">&nbsp;&gt;</span></a>
          </p>
        </div>
      </div>
    </section>

    <!-- 혜택 -->
    <section class="sec" id="benefits" aria-labelledby="h-benefits">
      <div class="container">
        <header class="sec-head">
          <h2 id="h-benefits" tabindex="-1" data-c="why.title"></h2>
          <p data-c="site.slogan"></p>
        </header>
        <div class="benefit">
          <div class="benefit-img"><img id="benefitImg" alt="" loading="lazy" decoding="async"></div>
          <ul class="benefit-list">
            <li class="benefit-item">
              <svg class="benefit-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M9 16h9a4 4 0 0 1 8 0h9v8a4 4 0 0 1 0 8v8H9z"/><path d="M17 26h8"/></svg>
              <h3 data-l="b1t"></h3>
              <p data-l="b1d"></p>
            </li>
            <li class="benefit-item">
              <svg class="benefit-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M11 37C11 21 21 11 38 10c0 18-9 27-25 27"/><path d="M11 37l14-14"/><path d="M8 40l3-3"/></svg>
              <h3 data-l="b2t"></h3>
              <p data-l="b2d"></p>
            </li>
            <li class="benefit-item">
              <svg class="benefit-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 9h9v3h6V9h19v11H22v-3h-6v3H7z"/><path d="M7 28h9v3h6v-3h11v11H22v-3h-6v3H7z"/></svg>
              <h3 data-l="b3t"></h3>
              <p data-l="b3d"></p>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <!-- 공지사항 -->
    <section class="sec" id="notice" aria-labelledby="h-notice">
      <div class="container">
        <header class="sec-head">
          <h2 id="h-notice" tabindex="-1" data-i18n="notice.title"></h2>
        </header>
        <div class="card notice" id="noticeList"></div>
      </div>
    </section>

    <!-- 참가 신청 -->
    <section class="sec sec-last" id="apply" aria-labelledby="h-apply">
      <div class="container">
        <header class="sec-head">
          <h2 id="h-apply" tabindex="-1" data-i18n="form.title"></h2>
          <p data-i18n="form.desc"></p>
        </header>
        <div class="card form-card">
          <form class="entry" id="entryForm" novalidate>
            <p class="form-error" id="formError" role="alert" hidden></p>
            <div class="form-grid">
              <div class="field">
                <label for="f-name"><span data-i18n="form.name"></span><em class="req" aria-hidden="true">*</em></label>
                <input id="f-name" name="name" type="text" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="f-org"><span data-i18n="form.org"></span> <span class="opt">(<span data-i18n="form.optional"></span>)</span></label>
                <input id="f-org" name="org" type="text" autocomplete="organization">
              </div>
              <div class="field">
                <label for="f-phone"><span data-i18n="form.phone"></span><em class="req" aria-hidden="true">*</em></label>
                <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required>
              </div>
              <div class="field">
                <label for="f-email"><span data-i18n="form.email"></span><em class="req" aria-hidden="true">*</em></label>
                <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required>
              </div>
              <div class="field">
                <label for="f-division"><span data-i18n="form.division"></span><em class="req" aria-hidden="true">*</em></label>
                <div class="select-wrap">
                  <select id="f-division" name="division" required></select>
                  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </div>
              </div>
              <div class="field">
                <label for="f-members"><span data-i18n="form.members"></span></label>
                <input id="f-members" name="members" type="number" min="1" max="99" value="1" inputmode="numeric">
              </div>
            </div>
            <div class="field">
              <label for="f-message"><span data-i18n="form.message"></span> <span class="opt">(<span data-i18n="form.optional"></span>)</span></label>
              <textarea id="f-message" name="message" rows="4"></textarea>
            </div>
            <div class="hp" aria-hidden="true">
              <label for="f-website">Website</label>
              <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>
            <label class="agree" for="f-agree">
              <input id="f-agree" name="agree" type="checkbox">
              <span class="agree-box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
              <span data-i18n="form.agree"></span>
            </label>
            <div class="form-actions">
              <button class="btn btn-wide" type="submit" data-i18n="form.submit"></button>
            </div>
          </form>

          <div class="done" id="formDone" hidden>
            <span class="done-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
            <h3 class="done-title" id="doneTitle" tabindex="-1" data-i18n="form.successTitle"></h3>
            <p class="done-desc" data-i18n="form.successDesc"></p>
            <dl class="done-no">
              <dt data-i18n="form.entryNo"></dt>
              <dd id="doneNo"></dd>
            </dl>
            <button class="btn" type="button" id="formAgain" data-i18n="form.again"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 푸터 -->
  <footer class="foot">
    <div class="container">
      <ul class="foot-help">
        <li>
          <svg class="foot-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M15 8h5l3 8-4 3a20 20 0 0 0 10 10l3-4 8 3v5a3 3 0 0 1-3 3A29 29 0 0 1 12 11a3 3 0 0 1 3-3z"/></svg>
          <strong data-l="tel"></strong>
          <a id="footTel" class="foot-help-val"></a>
        </li>
        <li>
          <svg class="foot-ico" viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="11" width="34" height="26" rx="1"/><path d="M8 12l16 13 16-13"/></svg>
          <strong data-i18n="form.email"></strong>
          <a id="footMail" class="foot-help-val"></a>
        </li>
        <li>
          <svg class="foot-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 16h28l-2.4 24H12.4z"/><path d="M18 16v-3a6 6 0 0 1 12 0v3"/></svg>
          <strong data-i18n="nav.store"></strong>
          <a class="foot-help-val" href="https://smartstore.naver.com/cocodroneshop" data-store target="_blank" rel="noopener"><span data-i18n="cta.store"></span><span aria-hidden="true">&nbsp;&gt;</span></a>
        </li>
      </ul>

      <div class="foot-links">
        <div class="foot-col foot-brand">
          <a class="logo" href="#top" data-goto="top">COCODRONE</a>
          <p data-c="site.slogan"></p>
        </div>
        <div class="foot-col">
          <h3 data-i18n="nav.menu"></h3>
          <ul>
            <li><a href="#competition" data-goto="competition" data-i18n="nav.competition"></a></li>
            <li><a href="#film" data-goto="film" data-i18n="nav.video"></a></li>
            <li><a href="#products" data-goto="products" data-i18n="nav.products"></a></li>
            <li><a href="#notice" data-goto="notice" data-i18n="nav.notice"></a></li>
            <li><a href="#apply" data-goto="apply" data-i18n="nav.apply"></a></li>
          </ul>
        </div>
        <div class="foot-col">
          <h3 data-i18n="nav.about"></h3>
          <ul>
            <li><a href="#benefits" data-goto="benefits" data-c="why.title"></a></li>
            <li><a href="https://smartstore.naver.com/cocodroneshop" data-store target="_blank" rel="noopener" data-i18n="nav.store"></a></li>
          </ul>
        </div>
        <div class="foot-col">
          <h3 data-l="lang"></h3>
          <div class="foot-lang lang-switch" id="langFoot" role="group" data-l-attr="aria-label:lang"></div>
        </div>
      </div>

      <div class="foot-bottom">
        <p class="foot-company">
          <strong data-i18n="footer.company"></strong>
          <span><span data-i18n="footer.bizNo"></span> <span data-c="site.bizNo"></span></span>
          <span><span data-i18n="footer.office"></span> <span data-c="site.address"></span></span>
        </p>
        <p class="foot-demo" data-i18n="footer.demo"></p>
        <p class="foot-copy" data-i18n="footer.rights"></p>
      </div>
    </div>
  </footer>

  <!-- 플로팅 버튼 -->
  <div class="fab">
    <button class="fab-btn fab-top" id="fabTop" type="button" data-i18n-attr="aria-label:cta.top;title:cta.top">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
    <a class="fab-btn fab-store" href="https://smartstore.naver.com/cocodroneshop" data-store target="_blank" rel="noopener" data-i18n-attr="aria-label:nav.store;title:nav.store">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
    </a>
  </div>

  <script src="../shared/coco-data.js"></script>
  <script src="../shared/coco-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
